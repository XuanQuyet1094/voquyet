name: Private log retention
on:
  workflow_dispatch:
env:
  REWARDS_GROUP_LABEL: group2

permissions:
  contents: read
concurrency:
  group: rewards-accounts-1-6
  cancel-in-progress: false
jobs:
  cleanup:
    if: ${{ vars.REWARDS_GROUP2_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Keep three Vietnam calendar days of private logs
        env:
          REWARDS_PRIVATE_REPO: XuanQuyet1094/rewards-state-group2
          REWARDS_STATE_TOKEN: ${{ secrets.REWARDS_STATE_TOKEN }}
        run: node .github/scripts/rewards-operations.cjs cleanup
