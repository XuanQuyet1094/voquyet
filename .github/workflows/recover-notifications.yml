name: Recover saved Telegram notifications
on:
  workflow_dispatch:
env:
  REWARDS_GROUP_LABEL: group2

permissions:
  contents: read
concurrency:
  group: rewards-notification-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ vars.REWARDS_GROUP2_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retry saved notifications only; never run bot
        env:
          REWARDS_PRIVATE_REPO: XuanQuyet1094/rewards-state-group2
          REWARDS_STATE_TOKEN: ${{ secrets.REWARDS_STATE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node .github/scripts/rewards-runner.cjs resend
